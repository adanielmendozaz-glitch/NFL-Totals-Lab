name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing keystore
        env:
          NFL_KEYSTORE_BASE64: ${{ secrets.NFL_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/nfl-signing"
          printf '%s' "$NFL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nfl-signing/nfl-totals-lab-dev.jks"

      - name: Build debug APK
        env:
          NFL_KEYSTORE_PATH: ${{ runner.temp }}/nfl-signing/nfl-totals-lab-dev.jks
          NFL_STORE_PASSWORD: ${{ secrets.NFL_STORE_PASSWORD }}
          NFL_KEY_ALIAS: ${{ secrets.NFL_KEY_ALIAS }}
          NFL_KEY_PASSWORD: ${{ secrets.NFL_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NFL-Totals-Lab-V0.6.1-Visual-Pack
          path: app/build/outputs/apk/debug/app-debug.apk
